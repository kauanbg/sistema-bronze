<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Pauluzzi Bronze</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
        .cabecalho { background: linear-gradient(135deg, #d4af37, #ff69b4); padding: 20px; text-align: center; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .cabecalho h1 { margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        table { width: 100%; border-collapse: collapse; background: #242424; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #444; font-size: 14px; }
        th { background-color: #333; color: #d4af37; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; }
        tr:hover { background-color: #2b2b2b; }
        
        .btn-apagar { background-color: #ff4757; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; display: flex; align-items: center; gap: 5px; }
        .btn-apagar:hover { background-color: #ff6b81; }

        .btn-whatsapp { color: #25d366; text-decoration: none; font-weight: bold; }
        .btn-whatsapp:hover { text-decoration: underline; }

        .badge-oculos { background: #ff69b4; color: white; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }

        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr { display: block; }
            th { display: none; }
            tr { margin-bottom: 15px; border: 1px solid #444; border-radius: 8px; }
            td { text-align: right; padding-left: 50%; position: relative; }
            td::before { content: attr(data-label); position: absolute; left: 15px; width: 45%; text-align: left; font-weight: bold; color: #d4af37; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="cabecalho">
            <h1>Painel Administrativo 👑</h1>
            <p>Gerenciamento de Agendamentos - Pauluzzi Bronze</p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Data / Hora</th>
                    <th>Cliente</th>
                    <th>WhatsApp</th>
                    <th>Serviço</th>
                    <th>Investimento (R$)</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="tabelaAgendamentos">
                <tr><td colspan="6" style="text-align: center;">Carregando agendamentos...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Função para carregar os agendamentos do banco de dados
        async function carregarAgendamentos() {
            try {
                const resposta = await fetch('/agendamentos'); // Rota que busca os agendamentos no seu backend
                const dados = await resposta.json();
                
                const tabela = document.getElementById('tabelaAgendamentos');
                tabela.innerHTML = '';

                if (dados.length === 0) {
                    tabela.innerHTML = '<tr><td colspan="6" style="text-align: center;">Nenhum agendamento encontrado.</td></tr>';
                    return;
                }

                dados.forEach(agendamento => {
                    const dataFormatada = agendamento.data.split('-').reverse().join('/');
                    const valorFormatado = parseFloat(agendamento.valor).toFixed(2).replace('.', ',');
                    const oculosInfo = agendamento.oculos ? '<span class="badge-oculos">Óculos</span>' : '';
                    const linkWhats = `https://wa.me/55${agendamento.telefone.replace(/\D/g, '')}`;

                    tabela.innerHTML += `
                        <tr>
                            <td data-label="Data / Hora"><strong>${dataFormatada}</strong> às ${agendamento.hora}</td>
                            <td data-label="Cliente">${agendamento.nome}</td>
                            <td data-label="WhatsApp"><a href="${linkWhats}" target="_blank" class="btn-whatsapp">${agendamento.telefone}</a></td>
                            <td data-label="Serviço">${agendamento.tipo} ${oculosInfo}</td>
                            <td data-label="Investimento (R$)" style="color: #2ed573; font-weight: bold;">R$ ${valorFormatado}</td>
                            <td data-label="Ação">
                                <button class="btn-apagar" onclick="apagarAgendamento('${agendamento._id}')">🗑️ Apagar</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (erro) {
                console.error("Erro ao carregar:", erro);
                document.getElementById('tabelaAgendamentos').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #ff4757;">Erro ao carregar os dados.</td></tr>';
            }
        }

        // Função para apagar o agendamento
        async function apagarAgendamento(id) {
            const confirmacao = confirm("Tem certeza que deseja apagar este agendamento? Esta ação não pode ser desfeita.");
            
            if (confirmacao) {
                try {
                    const resposta = await fetch(`/agendamentos/${id}`, {
                        method: 'DELETE'
                    });

                    if (resposta.ok) {
                        alert("✅ Agendamento apagado com sucesso!");
                        carregarAgendamentos(); // Recarrega a tabela automaticamente
                    } else {
                        alert("❌ Erro ao apagar o agendamento.");
                    }
                } catch (erro) {
                    alert("❌ Erro de conexão ao tentar apagar.");
                }
            }
        }

        // Carrega os dados assim que a página abre
        window.onload = carregarAgendamentos;
    </script>

</body>
</html>
