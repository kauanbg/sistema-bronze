<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Administração - Pauluzzi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2d3436; color: white; padding: 20px; margin: 0;}
        .container { max-width: 1000px; margin: 0 auto; }
        h2, h3 { color: #ff69b4; text-align: center; border-bottom: 1px solid #555; padding-bottom: 10px;}
        .card-admin { background: #3a4042; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; color: #333; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #ff69b4; color: white; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="file"] { padding: 10px; width: 100%; margin-top: 10px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; font-size: 14px;}
        button { padding: 12px 20px; margin-top: 15px; background: #ff69b4; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s;}
        button:hover { background: #ff1493; }
        .btn-apagar { background: #ff4757; padding: 6px 12px; font-size: 12px; }
        .dias-checkbox label { display: inline-block; margin-right: 15px; margin-top: 10px; color: #ccc;}
    </style>
</head>
<body>

    <div class="container">
        <h2>Painel Administrativo ☀️</h2>

        <div class="card-admin">
            <h3>Criar Nova Promoção</h3>
            <form id="formPromo">
                <input type="text" id="tituloPromo" placeholder="Nome da Promoção (Ex: Terça Maluca)" required>
                
                <label style="margin-top: 15px; display:block; color:#ff69b4;">Escolher foto (Galeria/Computador):</label>
                <input type="file" id="fotoArquivo" accept="image/*" required>

                <input type="number" id="precoPromo" placeholder="Valor (Investimento) Fixo" required>
                
                <p style="margin-bottom: 0; color: #ff69b4; margin-top: 15px;">Dias da semana válidos:</p>
                <div class="dias-checkbox">
                    <label><input type="checkbox" name="dias" value="0" data-nome="Dom"> Dom</label>
                    <label><input type="checkbox" name="dias" value="1" data-nome="Seg"> Seg</label>
                    <label><input type="checkbox" name="dias" value="2" data-nome="Ter"> Ter</label>
                    <label><input type="checkbox" name="dias" value="3" data-nome="Qua"> Qua</label>
                    <label><input type="checkbox" name="dias" value="4" data-nome="Qui"> Qui</label>
                    <label><input type="checkbox" name="dias" value="5" data-nome="Sex"> Sex</label>
                    <label><input type="checkbox" name="dias" value="6" data-nome="Sáb"> Sáb</label>
                </div>
                
                <button type="submit" style="width: 100%;">Salvar Promoção e Mostrar no Site</button>
            </form>

            <h4 style="margin-top: 30px;">Promoções Ativas no Site</h4>
            <table>
                <thead><tr><th>Título</th><th>Investimento</th><th>Ação</th></tr></thead>
                <tbody id="tabelaPromos"></tbody>
            </table>
        </div>

        <div class="card-admin">
            <h3>Lista de Agendamentos</h3>
            <button onclick="carregarAgendamentos()" style="margin-bottom: 15px;">Atualizar Lista</button>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>WhatsApp</th>
                        <th>Tipo/Promoção</th>
                        <th>Data/Hora</th>
                        <th>Investimento</th>
                    </tr>
                </thead>
                <tbody id="tabelaAgendamentos"></tbody>
            </table>
        </div>
    </div>

    <script>
        let senhaAdmin = "141607";

        window.onload = () => {
            carregarAgendamentos();
            carregarPromocoes();
        };

        function converterImagemParaBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('formPromo').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const checks = document.querySelectorAll('input[name="dias"]:checked');
            const diasNum = Array.from(checks).map(c => c.value);
            const diasNomes = Array.from(checks).map(c => c.getAttribute('data-nome'));

            if (diasNum.length === 0) { alert('Selecione pelo menos um dia da semana!'); return; }

            const inputFoto = document.getElementById('fotoArquivo');
            let fotoBase64 = '';
            if (inputFoto.files && inputFoto.files[0]) {
                fotoBase64 = await converterImagemParaBase64(inputFoto.files[0]);
            }

            const promo = {
                titulo: document.getElementById('tituloPromo').value,
                foto: fotoBase64,
                preco: document.getElementById('precoPromo').value,
                diasNum: diasNum,
                dias: diasNomes
            };

            const response = await fetch('/promocoes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'codigo-secreto': senhaAdmin },
                body: JSON.stringify(promo)
            });

            if (response.status === 401) {
                alert("Erro de autenticação! A senha no banco de dados não confere.");
                return;
            }
            
            document.getElementById('formPromo').reset();
            carregarPromocoes();
            alert('Promoção criada com sucesso!');
        });

        async function carregarPromocoes() {
            const res = await fetch('/promocoes');
            const dados = await res.json();
            const tabela = document.getElementById('tabelaPromos');
            tabela.innerHTML = "";
            
            dados.forEach(p => {
                tabela.innerHTML += `<tr>
                    <td>${p.titulo}</td>
                    <td>R$ ${p.preco}</td>
                    <td><button class="btn-apagar" onclick="apagarPromo('${p._id}')">Apagar</button></td>
                </tr>`;
            });
        }

        async function apagarPromo(id) {
            await fetch(`/promocoes/${id}`, {
                method: 'DELETE',
                headers: { 'codigo-secreto': senhaAdmin }
            });
            carregarPromocoes();
        }

        async function carregarAgendamentos() {
            const res = await fetch('/listar', {
                headers: { 'codigo-secreto': senhaAdmin }
            });
            
            if (res.status === 401) { 
                alert("Acesso negado: a senha do painel não bate com a senha do banco de dados!");
                return;
            }
            
            const respostaServidor = await res.json();
            const dados = respostaServidor.agendamentos;
            
            const tabela = document.getElementById('tabelaAgendamentos');
            tabela.innerHTML = dados.length ? "" : "<tr><td colspan='5'>Nenhum agendamento ainda.</td></tr>";
            
            dados.forEach(item => {
                tabela.innerHTML += `<tr>
                    <td><strong>${item.nome}</strong></td>
                    <td>${item.telefone}</td>
                    <td>${item.tipo}</td>
                    <td>${item.data.split('-').reverse().join('/')} às ${item.hora}</td>
                    <td style="color: green;">R$ ${item.valor}</td>
                </tr>`;
            });
        }
    </script>
</body>
</html>
</html>
