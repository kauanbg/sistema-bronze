<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço Bronze Pauluzzi - Agendamento</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #ffe4e1; margin: 0; padding: 0; color: #333; }
        .cabecalho { background-color: #ff69b4; color: white; text-align: center; padding: 25px 15px; }
        .cabecalho h1 { margin: 0; font-size: 26px; }
        .cabecalho p { margin: 8px 0 0 0; font-size: 14px; }
        .container { max-width: 900px; margin: 15px auto; padding: 0 15px; }
        .grid-promocoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card-promo { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; border: 2px solid transparent; }
        .card-promo:hover { transform: translateY(-3px); }
        .card-promo.selecionado { border-color: #ff69b4; box-shadow: 0 0 15px rgba(255, 105, 180, 0.5); }
        .foto-promo { width: 100%; height: 180px; object-fit: cover; background-color: #fce4ec; display: block; }
        .info-promo { padding: 15px; }
        .info-promo h3 { margin: 0 0 8px 0; color: #ff1493; font-size: 18px; }
        .preco-promo { font-size: 22px; font-weight: bold; color: #444; }
        .dias-promo { font-size: 12px; color: #888; margin-top: 5px; }
        .card-formulario { background-color: #ffffff; padding: 25px 20px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto 30px auto; }
        .card-formulario h2 { text-align: center; color: #ff69b4; margin-top: 0; font-size: 22px; }
        .grupo-input { margin-bottom: 15px; }
        .linha-dupla { display: flex; gap: 15px; }
        .linha-dupla .grupo-input { flex: 1; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; background: #fff; }
        input[readonly] { background-color: #f0f0f0; color: #666; cursor: not-allowed; }
        button { width: 100%; padding: 15px; background-color: #ff69b4; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #ff1493; }
        .btn-pagamento { display: block; text-align: center; background-color: #2ed573; color: white; text-decoration: none; padding: 14px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; font-size: 15px; }
        .btn-pagamento:hover { background-color: #26af5f; }

        /* Ajustes específicos para Celular */
        @media (max-width: 600px) {
            .linha-dupla { flex-direction: column; gap: 0; }
            .cabecalho h1 { font-size: 22px; }
            .card-formulario { padding: 20px 15px; }
            .grid-promocoes { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="cabecalho">
        <h1>Bem-vinda ao Espaço Bronze Pauluzzi☀️</h1>
        <p>Escolha sua promoção e garanta seu horário!</p>
    </div>

    <div class="container">
        <a href="/pagamento.html" class="btn-pagamento">💳 Ir para a Página de Pagamentos / Pix</a>
        
        <h2 style="text-align: center; color: #ff1493; font-size: 20px; margin-bottom: 15px;">Nossas Promoções</h2>
        <div class="grid-promocoes" id="listaPromocoes"></div>

        <div class="card-formulario" id="areaFormulario">
            <h2>Fazer Agendamento</h2>
            
            <form id="formCliente">
                <div class="grupo-input">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Digite seu nome">
                </div>
                
                <div class="linha-dupla">
                    <div class="grupo-input">
                        <label for="telefone">WhatsApp (Número)</label>
                        <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                    <div class="grupo-input">
                        <label for="tipo">Tipo de Bronze</label>
                        <select id="tipo" required>
                            <option value="Paredão">Paredão</option>
                            <option value="Máquina Turbo">Máquina Turbo</option>
                            <option value="Sol">Sol</option>
                        </select>
                    </div>
                </div>

                <div class="linha-dupla">
                    <div class="grupo-input">
                        <label for="data">Data</label>
                        <input type="date" id="data" required>
                    </div>
                    <div class="grupo-input">
                        <label for="hora">Hora (07:00 às 21:00)</label>
                        <input type="time" id="hora" min="07:00" max="21:00" required>
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="valor">Investimento (R$)</label>
                    <input type="number" id="valor" step="0.01" required placeholder="0.00">
                    <small id="avisoDias" style="color: red; font-size: 12px; display: none; margin-top: 5px;"></small>
                </div>
                
                <button type="submit">Confirmar Agendamento</button>
            </form>
        </div>
    </div>

    <script>
        let promocoesAtivas = [];
        let diasPermitidosPromo = [];

        window.onload = async () => {
            try {
                const res = await fetch('/promocoes');
                promocoesAtivas = await res.json();
                renderizarPromocoes();
            } catch (e) {
                console.log("Erro ao carregar promoções");
            }
        };

        function renderizarPromocoes() {
            const container = document.getElementById('listaPromocoes');
            container.innerHTML = '';
            
            if(promocoesAtivas.length === 0) {
                container.innerHTML = '<p style="text-align:center; width:100%; font-size: 14px; color: #666;">Nenhuma promoção no momento.</p>';
                return;
            }

            promocoesAtivas.forEach(promo => {
                const diasTexto = promo.dias.join(', ');
                const card = document.createElement('div');
                card.className = 'card-promo';
                const foto = promo.foto || 'https://via.placeholder.com/400x200/ffb6c1/ff1493?text=Bronze';

                card.innerHTML = `
                    <img src="${foto}" class="foto-promo" alt="Promoção">
                    <div class="info-promo">
                        <h3>${promo.titulo}</h3>
                        <div class="preco-promo">R$ ${promo.preco}</div>
                        <div class="dias-promo">Válido para: ${diasTexto}</div>
                    </div>
                `;

                card.onclick = () => {
                    document.querySelectorAll('.card-promo').forEach(c => c.classList.remove('selecionado'));
                    card.classList.add('selecionado');

                    const inputTipo = document.getElementById('tipo');
                    if (![...inputTipo.options].some(opt => opt.value === promo.titulo)) {
                        inputTipo.innerHTML += `<option value="${promo.titulo}" selected>${promo.titulo}</option>`;
                    }
                    inputTipo.value = promo.titulo;
                    
                    const inputValor = document.getElementById('valor');
                    inputValor.value = promo.preco;
                    inputValor.readOnly = true;

                    diasPermitidosPromo = promo.diasNum;
                    document.getElementById('avisoDias').style.display = 'block';
                    document.getElementById('avisoDias').innerText = `Válido apenas para: ${diasTexto}.`;

                    document.getElementById('areaFormulario').scrollIntoView({ behavior: 'smooth' });
                };
                container.appendChild(card);
            });
        }

        document.getElementById('formCliente').addEventListener('submit', async function(e) {
            e.preventDefault();

            const horaEscolhida = document.getElementById('hora').value;
            const horaNum = parseInt(horaEscolhida.split(':')[0]);
            
            if (horaNum < 7 || horaNum > 21) {
                alert('Os horários de atendimento devem ser distribuídos estritamente entre as 07:00 e as 21:00!');
                return;
            }

            if (diasPermitidosPromo.length > 0) {
                const dataEscolhida = new Date(document.getElementById('data').value + 'T00:00:00');
                const diaDaSemana = dataEscolhida.getDay();
                if (!diasPermitidosPromo.includes(diaDaSemana.toString())) {
                    alert('Data inválida para a promoção escolhida!');
                    return;
                }
            }

            const agendamento = {
                nome: document.getElementById('nome').value,
                telefone: document.getElementById('telefone').value,
                tipo: document.getElementById('tipo').value,
                data: document.getElementById('data').value,
                hora: document.getElementById('hora').value,
                valor: document.getElementById('valor').value
            };

            const resposta = await fetch('/salvar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(agendamento)
            });

            if (resposta.status === 400) {
                const erroServidor = await resposta.json();
                alert(erroServidor.erro);
                return;
            }

            alert('Agendamento realizado com sucesso!');
            window.location.reload();
        });
    </script>
</body>
</html>
