<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - Espaço Bronze</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #ffe4e1; margin: 0; padding: 20px; color: #333; text-align: center; }
        .card { background: white; max-width: 480px; margin: 30px auto; padding: 30px; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        h1 { color: #ff69b4; margin-top: 0; font-size: 26px; }
        .subtitulo { font-size: 15px; color: #555; margin-bottom: 20px; line-height: 1.4; }
        .qr-container { background: #fff0f5; padding: 20px; border-radius: 12px; display: inline-block; border: 2px solid #ffb6c1; margin: 15px 0; }
        .qr-container img { width: 220px; height: 220px; border-radius: 8px; display: block; margin: 0 auto; }
        .chave-box { background: #f8f9fa; padding: 12px; border-radius: 8px; font-size: 20px; font-weight: bold; word-break: break-all; margin: 15px 0; border: 1px dashed #ff69b4; color: #333; letter-spacing: 1px; }
        .btn-copiar { padding: 14px 28px; background: #2ed573; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.1s; width: 100%; margin-top: 10px; }
        .btn-copiar:hover { background: #26af5f; }
        .btn-copiar:active { transform: scale(0.98); }
        .btn-voltar { display: block; background: #ff69b4; color: white; padding: 12px 20px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 20px; transition: background 0.2s; }
        .btn-voltar:hover { background: #ff1493; }
        .aviso { font-size: 13px; color: #777; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Área de Pagamento 💳</h1>
        <p class="subtitulo">Escaneie o QR Code abaixo com o app do seu banco ou copie a chave Pix para realizar o pagamento:</p>
        
        <div class="qr-container">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=21974832980" alt="QR Code Pix - Espaço Bronze">
        </div>

        <p style="margin-bottom: 5px; font-size: 14px; color: #ff1493; font-weight: bold;">Chave Pix (Telefone):</p>
        <div class="chave-box" id="textoChave">21974832980</div>
        
        <button class="btn-copiar" onclick="copiarChave()">📋 Copiar Chave Pix</button>
        <p class="aviso">Após pagar, envie o comprovante de pagamento para o nosso WhatsApp para confirmar seu horário!</p>
        
        <a href="/" class="btn-voltar">⬅ Voltar para o Início</a>
    </div>

    <script>
        function copiarChave() {
            const texto = document.getElementById('textoChave').innerText;
            navigator.clipboard.writeText(texto).then(() => {
                alert('Chave Pix copiada com sucesso!');
            }).catch(() => {
                const inputTemp = document.createElement('input');
                inputTemp.value = texto;
                document.body.appendChild(inputTemp);
                inputTemp.select();
                document.execCommand('copy');
                document.body.removeChild(inputTemp);
                alert('Chave Pix copiada com sucesso!');
            });
        }
    </script>

</body>
</html>
